# Environment
ENV_NAME: "clean_up"
N_AGENTS: 5
N_ENVS: 100
TOTAL_TIMESTEPS: 100000000
NUM_STEPS: 100
SEED: 30

# Storage
WANDB: true
GIF_FRAMES: 1000
OUT_DIR: "results"

# Algorithm
ALGO: "RecurrentCOMA"
SMALL: true
HIDDEN_DIM: 32

# Optimization loop
UPDATE_EPOCHS: 10
NUM_MINIBATCHES: 10000

# Optimizer
MAX_GRAD_NORM: 0.5
LR: 0.0001

# Advantage & Loss
GAMMA: 0.99
GAE_LAMBDA: 0.95
CLIP_EPS: 0.2
VF_COEF: 0.5 
ENT_COEF: 0.03